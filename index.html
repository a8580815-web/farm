<title>好友菜園</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* 版面：全螢幕 2.5D 農場畫布（可拖曳、縮放）＋ 浮在上面的卡通木框 HUD 與底部工具列。刻意單一白天配色。 */
:root{
  color-scheme: light;
  --grass:#7cc04a; --grass-dk:#5fa135; --ink:#3a2614; --cream:#fff6dc; --cream-2:#f3dfae;
  --wood:#9a5f2e; --wood-lt:#c6844a; --gold:#ffc83a; --gold-dk:#d99a0b; --red:#e2513a; --sky:#5ab2e6; --muted:#7b6447;
  --f-body:"Noto Sans TC",system-ui,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"Fredoka","Noto Sans TC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:var(--f-body);color:var(--ink);background:var(--grass-dk);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;touch-action:none;cursor:grab;background:radial-gradient(120% 90% at 50% 40%,#8fd05a,#5c9c33)}
#stage:active{cursor:grabbing}
#stage svg{width:100%;height:100%;display:block}

/* 動畫 */
.bob{animation:bob 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
.wag{animation:wag .6s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 100%}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
.zz{animation:zz 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes wag{50%{transform:rotate(18deg)}}
@keyframes sway{50%{transform:rotate(2deg)}}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}40%{opacity:1}100%{opacity:0;transform:translate(8px,-14px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* HUD */
.panel{background:var(--cream);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink)}
.hud{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:5;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.hud > *{pointer-events:auto}
.me{display:flex;gap:10px;align-items:center;padding:6px 12px 6px 6px;min-width:0;flex:0 1 auto}
.ava{width:42px;height:42px;border-radius:10px;border:3px solid var(--ink);display:grid;place-items:center;font-weight:900;color:#fff;font-size:18px;flex:0 0 auto}
.me .info{min-width:0}
.me b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.stats{display:flex;gap:10px;align-items:center;font-family:var(--f-num);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.lvl{background:var(--sky);color:#fff;border:2px solid var(--ink);border-radius:20px;padding:0 7px;font-size:12px}
.coin{display:flex;align-items:center;gap:4px}
.coin img{width:20px;height:20px;object-fit:contain}
.xpbar{height:7px;border:2px solid var(--ink);border-radius:6px;background:#e9d7a8;margin-top:3px;overflow:hidden;max-width:120px}
.xpbar i{display:block;height:100%;background:var(--gold)}
.clock{margin-left:auto;padding:6px 10px;font-size:12px;line-height:1.35;text-align:right;flex:0 0 auto}
.clock b{font-family:var(--f-num);font-size:14px;color:var(--red)}
.visit{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--hudb,110px) + 8px);z-index:5;padding:6px 14px;font-weight:700;font-size:14px;background:var(--sky);color:#fff;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.ticker{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:4;padding:5px 12px;font-size:13px;max-width:calc(100% - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .4s}

.zoom{position:fixed;right:12px;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:8px}
.zbtn{width:44px;height:44px;border-radius:12px;font:700 22px var(--f-num);color:var(--ink);background:var(--cream);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
.zbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none}
.dock .in{pointer-events:auto;display:flex;gap:8px;padding:8px;background:var(--wood);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink),inset 0 3px 0 var(--wood-lt);max-width:520px;width:100%}
.tool{flex:1;min-width:0;font:inherit;font-weight:700;font-size:12px;color:var(--ink);background:var(--cream);border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);cursor:pointer;padding:5px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
.tool img{width:32px;height:32px;object-fit:contain}
.tool:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.tool .badge{position:absolute;top:-8px;right:-4px;background:var(--red);color:#fff;font:700 11px var(--f-num);border:2px solid var(--ink);border-radius:10px;padding:0 5px}
.tool:focus-visible,.zbtn:focus-visible,.btn:focus-visible{outline:3px solid var(--sky);outline-offset:3px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(40,25,10,.5);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:78vh;overflow:auto;margin:0 10px calc(10px + env(safe-area-inset-bottom,0px));padding:16px;display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-size:18px;font-weight:900;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sheet h3 small{font-size:12px;font-weight:500;color:var(--muted)}
.sheet h4{margin:4px 0 0;font-size:15px;font-weight:900}
.hint{font-size:12.5px;color:var(--muted);margin:0;line-height:1.6}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px;background:#fffdf3;border:2px solid var(--ink);border-radius:12px}
.item .ic{width:44px;height:44px;object-fit:contain}
.item .t{min-width:0;font-size:13px;line-height:1.45}
.item .t b{font-size:14.5px}
.item .t .m{color:var(--muted);font-size:12px}
.num{font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:0 7px;border:2px solid var(--ink);border-radius:10px;background:#fff;vertical-align:1px}
.chip.fam{background:#ffc9d8}.chip.hot{background:var(--red);color:#fff}.chip.lock{background:#ddd}.chip.ok{background:#c9f0a8}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:700;font-size:14px;color:var(--ink);background:var(--gold);border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);cursor:pointer;padding:8px 14px;min-height:44px;flex:1}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:#fff}.btn.red{background:var(--red);color:#fff}.btn.blue{background:var(--sky);color:#fff}
.btn.sm{flex:0 0 auto;min-height:36px;padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:flex;gap:6px}
.seg button{flex:1;font:inherit;font-weight:700;font-size:13px;padding:7px 4px;border:2px solid var(--ink);border-radius:10px;background:#fff;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold)}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pc{display:flex;align-items:center;gap:4px;padding:3px 5px;border:2px solid var(--ink);border-radius:9px;background:#fff;font-size:12px}
.pc img{width:24px;height:24px;object-fit:contain;flex:0 0 auto}
.pc.hot{background:#ffd1c6}
.house{display:flex;flex-direction:column;gap:6px;padding:10px;border:2px solid var(--ink);border-radius:12px;background:#fffdf3}
.house .hd{display:flex;align-items:center;gap:8px;font-weight:700}
.house .hd .sp{flex:1;min-width:0}
.mini{width:28px;height:28px;border-radius:8px;border:2px solid var(--ink);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:900}
.rumor{background:#fff0b3;border:2px dashed var(--ink);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.5}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:13px;line-height:1.5}
.log li{display:flex;gap:8px}
.log time{font-family:var(--f-num);font-size:12px;color:var(--muted);flex:0 0 auto}
input.txt{font:inherit;font-size:16px;padding:8px 10px;border:3px solid var(--ink);border-radius:10px;background:#fff;flex:1;min-width:0;user-select:text}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:36%;z-index:20;padding:8px 16px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);text-align:center;background:#fff}
[hidden]{display:none!important}
.pop{position:fixed;z-index:6;width:min(290px,calc(100% - 16px));padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.pop .ph{display:flex;align-items:center;gap:10px}
.pop .ph .ic{width:40px;height:40px;object-fit:contain}
.pop .pt{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.pop .pt b{font-size:15px}.pop .pt small{font-size:12px;color:var(--muted)}
.pop .pbar{height:9px;border:2px solid var(--ink);border-radius:6px;background:#efe0b8;overflow:hidden;flex:1}
.pop .pbar i{display:block;height:100%;background:var(--gold)}
.pop .pinfo{font-size:13px}
.pop .pa{display:flex;gap:6px;flex-wrap:wrap}.pop .pa .btn{flex:1;white-space:nowrap;padding-left:6px;padding-right:6px}
.pop .stat{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700}
.chip.warn{background:#ffd1c6}
.pop .stat .bond{display:flex;gap:2px;flex:1;align-items:center}.pop .stat .bond img{width:16px;height:16px;object-fit:contain}.pop .stat .bond i{width:13px;height:13px;border:2px solid #d9c49a;border-radius:50%;margin:0 1px}
.pop .stat small{font-size:11px;color:var(--muted)}
.lvchip{background:#ff4d7a;color:#fff;border:2px solid var(--ink);border-radius:10px;padding:0 6px;font:700 11px var(--f-num)}
.pop .guard{display:flex;align-items:center;gap:5px;font-size:12px;background:#fff0f3;border:2px dashed #ff9db3;border-radius:9px;padding:3px 8px}.pop .guard img{width:14px;height:14px}
.linkbtn{font:inherit;font-size:12px;color:var(--muted);background:none;border:0;text-decoration:underline;cursor:pointer;align-self:flex-start;padding:2px 0}
.float.heart{width:26px;height:26px;object-fit:contain}
.pop .pa.pet .btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px 5px;min-height:58px;font-size:12px;line-height:1.2}
.pop .pa.pet .btn img{width:28px;height:28px;object-fit:contain}
.ballfx{position:fixed;z-index:15;width:30px;height:30px;pointer-events:none;animation:ball 1s ease-out forwards}
@keyframes ball{0%{transform:translate(0,0)}35%{transform:translate(-30px,-60px) rotate(-200deg)}70%{transform:translate(-55px,0) rotate(-360deg)}85%{transform:translate(-62px,-14px) rotate(-420deg)}100%{transform:translate(-68px,0) rotate(-480deg);opacity:0}}
.petbody.hop{animation:hop .5s ease-out}.petbody.jump{animation:jump .8s ease-out}
@keyframes hop{30%{transform:translateY(-8px)}}
@keyframes jump{25%{transform:translateY(-26px) rotate(-8deg)}55%{transform:translateY(0)}75%{transform:translateY(-10px) rotate(6deg)}}
.petbody{transform-box:fill-box;transform-origin:center bottom}
.float{position:fixed;z-index:15;pointer-events:none;font:700 17px var(--f-num);color:#fff;-webkit-text-stroke:1px var(--ink);text-shadow:0 2px 0 var(--ink);animation:up 1.1s ease-out forwards;white-space:nowrap}
@keyframes up{to{transform:translateY(-46px);opacity:0}}

.rcol{margin-left:auto;display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:0 0 auto}
.rcol .clock{margin-left:0}
.hbtns{display:flex;gap:6px}
.hbtn{position:relative;height:38px;min-width:38px;padding:0 8px;display:flex;align-items:center;gap:4px;cursor:pointer;font:700 13px var(--f-num);color:var(--ink);border-radius:12px}
.hbtn img{width:24px;height:24px;object-fit:contain}
.hbtn .badge,.tool .badge{position:absolute;top:-8px;right:-6px;background:var(--red);color:#fff;font:700 11px var(--f-num);border:2px solid var(--ink);border-radius:10px;padding:0 5px;line-height:16px}
.coin img{width:18px;height:18px;object-fit:contain}
.stats{gap:6px;flex-wrap:wrap;font-size:13px}
.dock .in{gap:5px;padding:7px}
.tool{font-size:11px;padding:4px 1px 3px}
.tool img{width:28px;height:28px}
.tool.hl{animation:hlp 1s ease-in-out infinite;background:#fff3b0}
@keyframes hlp{50%{transform:translateY(-4px);box-shadow:0 7px 0 var(--ink)}}
.tutarrow{animation:tarr .9s ease-in-out infinite}
@keyframes tarr{50%{transform:translateY(-10px)}}
.tutcard{position:fixed;left:12px;top:calc(var(--hudb,110px) + 8px);z-index:5;max-width:min(250px,calc(100% - 90px));padding:8px 10px;display:flex;flex-direction:column;gap:2px;background:#fffbe6}
.tutcard .tn{font:700 11px var(--f-num);color:var(--red)}
.tutcard .tt{font-weight:900;font-size:14px;line-height:1.35}
.tutcard .tr{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.rw{display:inline-flex;align-items:center;gap:3px;font:700 13px var(--f-num);background:#fff;border:2px solid var(--ink);border-radius:10px;padding:0 7px;line-height:20px}
.rw img{width:16px;height:16px;object-fit:contain}
.mini-ic{width:15px;height:15px;object-fit:contain;vertical-align:-3px}
.btnic{width:20px;height:20px;object-fit:contain;vertical-align:-5px;margin-right:4px}
.pop .pa .btn .btnic{width:18px;height:18px}
.letter{background:#fffdf3;border:2px dashed #d8c79f;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.75}
.mailrow{text-align:left;font:inherit;color:inherit;cursor:pointer}
.mailrow.unread{background:#fff6d0}
.confirmbox{display:flex;align-items:center;gap:14px;justify-content:center;background:#e9f6ff;border:2px solid var(--ink);border-radius:14px;padding:12px}
.confirmbox img{width:52px;height:52px;object-fit:contain}
.confirmbox small{color:var(--muted)}
.orders{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.order{position:relative;background:#fff8dd;border:2px solid var(--ink);border-radius:6px;padding:16px 10px 10px;display:flex;flex-direction:column;gap:8px;box-shadow:2px 3px 0 rgba(58,38,20,.25);transform:rotate(-1deg)}
.order:nth-child(2){transform:rotate(1.2deg)}.order:nth-child(3){transform:rotate(-.4deg)}
.order .pin{position:absolute;top:-7px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#e2513a;border:2px solid var(--ink)}
.order.done{opacity:.6;text-align:center}
.oitems{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.oi{display:flex;flex-direction:column;align-items:center;font-size:12px;padding:3px;border-radius:8px}
.oi .ic{width:36px;height:36px}
.oi.ok{background:#d6f5c0}
.tabs2{margin-bottom:2px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.cell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;background:#fffdf3;border:2px solid var(--ink);border-radius:10px;font-size:10.5px;text-align:center;line-height:1.2}
.cell .ic{width:38px;height:38px}
.cell img.ic{object-fit:contain}
.cell.locked .ic,.cell.locked img{filter:brightness(0) opacity(.25)!important;animation:none!important}
.ach.got{opacity:.6}
.abar{height:7px;border:2px solid var(--ink);border-radius:5px;background:#efe0b8;overflow:hidden;margin:3px 0}
.abar i{display:block;height:100%;background:var(--gold)}
.vic{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.vic.ic{width:44px;height:44px}
.vic img{width:100%;height:100%;object-fit:contain}
.vic.big{width:110px;height:110px}
.var-gold img{filter:sepia(1) saturate(4.5) hue-rotate(-8deg) brightness(1.12) drop-shadow(0 0 3px #ffd84a)}
.var-glass img{filter:saturate(1.8) brightness(1.15) drop-shadow(0 0 5px #c49bff);animation:glass 2.4s linear infinite}
@keyframes glass{0%{filter:hue-rotate(0deg) saturate(1.8) brightness(1.15) drop-shadow(0 0 5px #c49bff)}100%{filter:hue-rotate(360deg) saturate(1.8) brightness(1.15) drop-shadow(0 0 5px #c49bff)}}
.art-glass img{filter:drop-shadow(0 0 4px #d6b4ff)}.art-gold img{filter:drop-shadow(0 0 3px #ffe27a)}
.var-gold::after,.var-glass::after{content:"";position:absolute;right:-2px;top:-2px;width:12px;height:12px;background:radial-gradient(circle,#fff 0 22%,transparent 24%),conic-gradient(from 45deg,transparent 0 10%,#fff 10% 15%,transparent 15% 35%,#fff 35% 40%,transparent 40% 60%,#fff 60% 65%,transparent 65% 85%,#fff 85% 90%,transparent 90%);border-radius:50%;animation:twk 1.4s ease-in-out infinite}
@keyframes twk{50%{transform:scale(.4);opacity:.4}}
.cropchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.cropchips button{flex:0 0 auto;display:flex;align-items:center;gap:4px;font:inherit;font-size:12px;font-weight:700;padding:3px 8px 3px 4px;border:2px solid var(--ink);border-radius:12px;background:#fff;cursor:pointer}
.cropchips img{width:22px;height:22px;object-fit:contain}
.cropchips button[aria-pressed="true"]{background:var(--gold)}
.chartbox{background:#fffdf3;border:2px solid var(--ink);border-radius:12px;padding:6px}
.trend{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend button{display:flex;align-items:center;gap:5px;font:inherit;font-size:12px;padding:2px 8px;border:2px solid var(--ink);border-radius:10px;background:#fff;cursor:pointer;opacity:.7}
.legend button[aria-pressed="true"]{opacity:1;background:#fff3b0;font-weight:700}
.legend i{width:12px;height:4px;border-radius:2px;display:inline-block}
.placebar{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--hudb,110px) + 8px);z-index:7;display:flex;align-items:center;gap:10px;padding:8px 10px;width:min(340px,calc(100% - 24px));background:#fffbe6}
.placebar div{flex:1;min-width:0}
.placebar img{width:40px;height:40px;object-fit:contain}
.placebar div{display:flex;flex-direction:column;line-height:1.3}.placebar small{font-size:12px;color:var(--muted)}
.charmchip{color:#d0457a}
#dragghost{position:fixed;z-index:30;width:84px;height:84px;object-fit:contain;transform:translate(-50%,-85%);pointer-events:none;opacity:.85;filter:drop-shadow(0 6px 4px rgba(0,0,0,.3))}
#dragghost.bad{opacity:.5;filter:grayscale(.6) drop-shadow(0 6px 4px rgba(0,0,0,.3))}
.avabtn{border:0;padding:0;background:none;cursor:pointer;flex:0 0 auto;border-radius:10px}
.avimg{display:inline-flex;border-radius:50%;border:3px solid var(--ink);background:#fff6dc;overflow:hidden;flex:0 0 auto}
.avimg img{width:100%;height:100%;object-fit:cover}
.avimg.ava{width:42px;height:42px}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.avpick{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;border:2px solid var(--ink);border-radius:12px;background:#fff;cursor:pointer;font:inherit;font-size:12px}
.avpick[aria-pressed="true"]{background:var(--gold)}

.boardinfo{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff0b3;border:2px solid var(--ink);border-radius:12px;padding:8px 12px}
.boardinfo div{display:flex;flex-direction:column;line-height:1.35}.boardinfo small{font-size:12px;color:var(--muted)}
.boardinfo .rf{align-items:flex-end}.boardinfo .rf b{font-size:18px}
.order.rare-gold{background:linear-gradient(160deg,#fff6c9,#ffe07a);border-color:#a8740a}
.order.rare-glass{background:linear-gradient(160deg,#fde7ff,#d9f3ff,#e8ddff)}
.rtag{align-self:center;font-size:11px;font-weight:900;color:#fff;background:#d0457a;border:2px solid var(--ink);border-radius:10px;padding:0 8px}
.order.rare-gold .rtag{background:#d99a0b}
.oi small{font-size:10px;max-width:80px;text-align:center;line-height:1.2}
.placebar.edit{background:#e9f6ff}

/* ---------- 工具 ---------- */
function hsh(str){let x=2166136261;for(let i=0;i<str.length;i++){x^=str.charCodeAt(i);x=Math.imul(x,16777619)}x^=x>>>13;x=Math.imul(x,1274126177);return ((x>>>0)%100000)/100000}
const rnd=(a,b)=>a+Math.random()*(b-a), rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1)), pick=a=>a[Math.random()*a.length|0];

const periodKey=(t=Date.now())=>dayKey(t)+(new Date(t).getHours()<12?'A':'P');
const periodName=()=>new Date().getHours()<12?'早盤':'午盤';
function nextRefresh(){const d=new Date(),n=new Date(d);if(d.getHours()<12)n.setHours(12,0,0,0);else{n.setDate(n.getDate()+1);n.setHours(0,0,0,0)}return n-d}
function fmtDur(ms){ms=Math.max(0,ms);const s=Math.ceil(ms/1000);if(s<60)return s+'秒';const m=Math.ceil(s/60);if(m<60)return m+'分';const h=Math.floor(m/60);return h+'小時'+(m%60?(m%60)+'分':'')}
const hhmm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 收購價：每戶 × 每作物 × 每半天各自不同；約 6% 機率暴漲 2.5～4 倍 */
function price(house,crop,per=periodKey()){
  const base=CROPS[crop].p,k=per+'|'+house+'|'+crop,spike=hsh(k+'#s')<.06;
  const m=spike?2.5+hsh(k+'#m')*1.5:.6+hsh(k)*.7;
  return {p:Math.max(1,Math.round(base*m)),spike};
}

}

}

const level=()=>Math.floor(Math.sqrt(S.xp/20))+1, lvXp=l=>20*(l-1)*(l-1);

function st(pl,now=Date.now()){
  if(!pl||!pl.c)return {kind:'empty'};
  const el=now-pl.t,prog=Math.min(1,el/pl.d),ripe=el>=pl.d;

}
function yieldOf(pl){const pen=(pl.bug&&!pl.bf?1:0)+(pl.dry&&!pl.df?1:0);return Math.max(1,pl.y-pen-pl.s)}

/* ---------- 離線模擬：好友偷菜、狗、家人幫忙、每日禮物 ---------- */
function newDay(){

function sim(){

const A=n=>'assets/'+n+(n==='grass'?'.jpg':'.png');
// 以底部中心 (x,y) 為錨點放一張圖，寬度 w
function img(n,x,y,w,ax=.5,ay=1){const h=w*SZ[n][1]/SZ[n][0];return `<image href="${A(n)}" x="${(x-w*ax).toFixed(1)}" y="${(y-h*ay).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}"/>`}
const CROPW={bokchoy:44,carrot:44,tomato:42,strawberry:46,corn:34,pumpkin:58,sprout:24,grow:36};
const SPOTS4=[[0,-14],[-27,0],[27,0],[0,14]], SPOTS2=[[-15,-4],[15,6]];

/* ---- 地塊 ---- */
const SOIL={soil_dry:{tx:128,cy:75,fw:259,fh:150},soil_wet:{tx:130,cy:76,fw:259,fh:159}};
function plotSvg(k,pl,owner){
  const {gx,gy}=plotGrid(k),c=iso(gx+.5,gy+.5),x=st(pl);
  const wet=x.kind==='crop'&&!x.dry, tile=wet?'soil_wet':'soil_dry', G=SOIL[tile];
  const sx=TW*1.04/G.fw, sy=TH*1.04/G.fh;   // 土地上表面剛好對齊格子，略放大 4% 讓相鄰格無縫
  let s=`<g data-p="${k}" style="cursor:pointer"${owner==='me'&&placing&&placing.plotK===k?' opacity=".35"':''}><image href="${A(tile)}" x="${(c.x-G.tx*sx).toFixed(1)}" y="${(c.y-G.cy*sy).toFixed(1)}" width="${(SZ[tile][0]*sx).toFixed(1)}" height="${(SZ[tile][1]*sy).toFixed(1)}" preserveAspectRatio="none"/>`;
  const sy0=c.y;
  if(x.kind==='crop'){
    const own=x.stage==='grow'&&SZ[pl.c+'_grow'], kind=x.stage==='ripe'?pl.c:own?pl.c+'_grow':x.stage, kw=own?CROPW[pl.c]*.82:CROPW[kind], sp=(pl.c==='pumpkin'&&x.stage!=='sprout')?SPOTS2:SPOTS4;
    s+=`<g class="sway">`+sp.slice().sort((p,q)=>p[1]-q[1]).map(([dx,dy])=>img(kind,c.x+dx,sy0+dy*.9+4,kw)).join('')+`</g>`;
    let icon='';
    if(x.dry)icon='ic_drop';else if(x.bug)icon='ic_bug';else if(x.ripe)icon=owner==='me'?'ic_ripe':(isFam(owner)?'':'ic_steal');
    const top=pl.c==='corn'&&x.stage==='ripe'?70:46;
    if(icon)s+=`<g class="bob">${img(icon,c.x,sy0-top,34)}</g>`;
    if(!x.ripe)s+=`<g transform="translate(${c.x-20} ${c.y+6})"><rect width="40" height="6" rx="3" fill="#3a2614" opacity=".55"/><rect width="${(40*x.prog).toFixed(1)}" height="6" rx="3" fill="#ffd43b"/></g>`;
  }
  return s+'</g>';
}
function nextPlotFree(){return S.plots.length<MAX_PLOTS&&!!nextPlotCell()}
function lockedSvg(k,cost,req){
  const blocked=false,nc=nextPlotCell();if(!nc)return'';
  const {gx,gy}=nc,c=iso(gx+.5,gy+.5),a=TW/2*.86,b=TH/2*.86;
  const T=[{x:c.x,y:c.y-b},{x:c.x+a,y:c.y},{x:c.x,y:c.y+b},{x:c.x-a,y:c.y}];
  return `<g data-expand="1" style="cursor:pointer"><polygon points="${pts(T)}" fill="rgba(255,255,255,.25)" stroke="#fff" stroke-width="3" stroke-dasharray="8 6"/>
   <g transform="translate(${c.x} ${c.y-6})"><g class="bob"><rect x="-40" y="-14" width="80" height="28" rx="14" fill="#fff6dc" stroke="${K}" stroke-width="2.5"/>
   <text x="0" y="5" text-anchor="middle" font-family="Fredoka,Noto Sans TC,sans-serif" font-weight="700" font-size="13" fill="${K}">${blocked?'被擋住了':level()<req?'Lv'+req+' 開放':'擴建 '+cost}</text></g></g></g>`;
}
function fenceSeg(g0,g1,mirror){
  const a=iso(g0[0],g0[1]),b=iso(g1[0],g1[1]),m={x:(a.x+b.x)/2,y:(a.y+b.y)/2},w=Math.abs(b.x-a.x)/.74,h=w*SZ.fence[1]/SZ.fence[0];
  return `<g transform="translate(${m.x.toFixed(1)} ${m.y.toFixed(1)})${mirror?' scale(-1 1)':''}"><image href="${A('fence')}" x="${(-w/2).toFixed(1)}" y="${(-h*.72).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}"/></g>`;
}

/* ---- 場景組合 ---- */

/* ---- 可移動的擺設（房子、寵物屋、信箱、佈告欄、樹、灌木…） ---- */
const FIXK={
 house:{n:'房子',w:3,h:3},pethouse:{n:'寵物屋',w:2,h:2},board:{n:'佈告欄',w:1,h:1},mailbox:{n:'信箱',w:1,h:1},
 hay:{n:'乾草堆',w:1,h:1},trough:{n:'水槽',w:1,h:1},tree:{n:'大樹',w:1,h:1},bush:{n:'花叢',w:1,h:1},farm:{n:'農田',w:2,h:2},
};
const REMOVABLE=['tree','bush','hay','trough'];
function fixSize(f){return FIXK[f.k]}
const fixImg=f=>f.k==='house'?HOUSES[S.house.style].img:f.k==='pethouse'?(PETS[S.pet.id].kind==='cat'?'cathouse':'doghouse'):f.k==='farm'?'soil_dry':f.k;
function defaultFixtures(){
  const f=[{id:'house',k:'house',gx:2,gy:2},{id:'pethouse',k:'pethouse',gx:6,gy:2},{id:'board',k:'board',gx:10,gy:2},{id:'mailbox',k:'mailbox',gx:3,gy:5},{id:'hay',k:'hay',gx:14,gy:1},{id:'trough',k:'trough',gx:16,gy:4}];
  const T=[[0,1],[1,8],[0,12],[1,16],[2,20],[4,24],[9,25],[14,24],[19,25],[23,23],[24,18],[23,13],[24,8],[22,2],[18,1],[11,1],[20,14],[16,20]];
  T.forEach(([x,y],i)=>f.push({id:'tree'+i,k:'tree',gx:x,gy:y}));
  const B=[[3,7],[2,11],[15,9],[16,14],[8,16],[12,17],[19,5],[4,17],[18,18],[6,21],[21,10],[11,21]];
  B.forEach(([x,y],i)=>f.push({id:'bush'+i,k:'bush',gx:x,gy:y}));

}
const DEFAULT_FIX=defaultFixtures();
const fixOf=id=>(at==='me'?S.fixtures:DEFAULT_FIX).find(f=>f.id===id);
function petSpot(fx){const p=(fx||[]).find(f=>f.k==='pethouse')||{gx:6,gy:2};const r=rotOf(p);return (r===1||r===2)?{x:p.gx+1.8,y:p.gy+.3}:{x:p.gx+.3,y:p.gy+1.8}}
const BAX={doghouse_b:.5,cathouse_b:.47};
const rotOf=o=>o?(o.rot!=null?o.rot:(o.flip?1:0)):0;
// 四方向：0 原圖、1 鏡像、2 背面圖、3 背面鏡像（沒有背面圖時 2/3 退回 0/1）
const rimg=(o,n)=>{const r=rotOf(o);if(r>=2&&SZ[n+'_b'])return [n+'_b',r===3];return [n,r%2===1]};
const mir=(on,x,inner)=>on?`<g transform="matrix(-1,0,0,1,${(2*x).toFixed(1)},0)">${inner}</g>`:inner;
function sceneObjects(owner){
  const mine=owner==='me';
  const plots=mine?S.plots:farmOf(owner).plots;
  const objs=[];
  const add=(z,svg)=>objs.push({z,svg});
  const FX_=mine?S.fixtures:DEFAULT_FIX, moving=id=>placing&&placing.fixId===id?' opacity=".35"':'';
  const pid=mine?S.pet.id:farmOf(owner).pet, awake=mine?petAwake():farmOf(owner).fed, isCat=PETS[pid].kind==='cat';
  FX_.forEach(f=>{
    if(f.k==='farm')return;
    const tag=`data-fix="${f.id}" style="cursor:pointer"${moving(f.id)}`;
    if(f.k==='house'){const HS=mine?HOUSES[S.house.style]:isNpc(owner)?CHIEF_HOUSE():HOUSES.farm,H0=iso(f.gx+2.4,f.gy+2.4),[hn,hm]=rimg(f,HS.img);add(f.gx+f.gy+3.8,`<g ${tag} data-house="1">${mir(hm,H0.x,img(hn,H0.x+20,H0.y+22,HS.w,HS.ax,1))}</g>`)}
    else if(f.k==='pethouse'){const [dn,dm]=rimg(f,isCat?'cathouse':'doghouse'),D0=dm?iso(f.gx+.9,f.gy+1.1):iso(f.gx+1.1,f.gy+.9);add(f.gx+f.gy+1.5,`<g ${tag}>${mir(dm,D0.x,img(dn,D0.x+4,D0.y+12,140,BAX[dn]||.55,1))}</g>`);
      const sp=petSpot([f]),dp=iso(sp.x,sp.y);if(!(placing&&placing.fixId===f.id))add(f.gx+f.gy+2.1,`<g data-pet="1" style="cursor:pointer"><g class="petbody">${mir(sp.x>f.gx+1,dp.x,img(petImg(pid,awake),dp.x,dp.y,awake?(isCat?60:66):(isCat?68:76)))}</g></g>${awake?'':`<g class="zz"><text x="${dp.x+20}" y="${dp.y-52}" font-family="Fredoka,sans-serif" font-weight="700" font-size="18" fill="#fff" stroke="${K}" stroke-width="1.2">z</text></g><g class="zz" style="animation-delay:1s"><text x="${dp.x+30}" y="${dp.y-64}" font-family="Fredoka,sans-serif" font-weight="700" font-size="14" fill="#fff" stroke="${K}" stroke-width="1.2">z</text></g>`}`)}
    else if(f.k==='board'){const bd=iso(f.gx+.5,f.gy+.9);add(f.gx+f.gy+1.5,`<g ${tag} data-board="1">${(([n,m])=>mir(m,bd.x,img(n,bd.x,bd.y,92)))(rimg(f,'board'))}</g>`)}
    else if(f.k==='mailbox'){if(!mine)return;const mb=iso(f.gx+.6,f.gy+.8);add(f.gx+f.gy+1.4,`<g ${tag} data-mailbox="1">${(([n,m])=>mir(m,mb.x,img(n,mb.x,mb.y,52)))(rimg(f,'mailbox'))}${unreadMail()?`<g class="bob"><circle cx="${mb.x+16}" cy="${mb.y-88}" r="11" fill="#e2513a" stroke="${K}" stroke-width="2.5"/><text x="${mb.x+16}" y="${mb.y-83.5}" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="700" font-size="13" fill="#fff">${unreadMail()}</text></g>`:''}</g>`)}
    else{const c=iso(f.gx+.5,f.gy+.5),w=f.k==='tree'?140+(f.id.length+f.gx)%3*22:f.k==='bush'?62:f.k==='hay'?100:110;add(f.gx+f.gy+1,`<g ${tag}>${(([n,m])=>mir(m,c.x,img(n,c.x,c.y+6,w)))(rimg(f,f.k))}</g>`)}
  });
  plots.forEach((pl,k)=>{const g=plotGrid(k);add(g.gx+g.gy+1,plotSvg(k,pl,owner))});
  if(mine&&S.plots.length<MAX_PLOTS&&!placing){const k=S.plots.length,g=nextPlotCell();if(g)add(g.gx+g.gy+.8,lockedSvg(k,plotCost(k),plotReqLv(k)))}
  const put=(gx,gy,n,w)=>{const c=iso(gx,gy);add(gx+gy,img(n,c.x,c.y,w))};
  if(!mine&&isNpc(owner))CHIEF_DECOS.forEach(([t,gx,gy])=>{const D=DECOS[t];if(!D)return;const c=iso(gx+.5,gy+.5);add(gx+gy+1,img(D.img,c.x,c.y+14,D.w))});
  if(mine){
    S.decos.forEach(d=>{const D=DECOS[d.type];if(!D)return;const c=iso(d.gx+.5,d.gy+.5);add(d.gx+d.gy+1,`<g data-deco="${d.id}" style="cursor:pointer"${placing&&placing.moveId===d.id?' opacity=".35"':''}>${(([n,m])=>mir(m,c.x,img(n,c.x,c.y+14,D.w)))(rimg(d,D.img))}</g>`)});
    const ta=tutArrowSvg();if(ta)add(999,ta);}
  for(let g=.6;g<N-.6;g+=2)add(g+.6-.5,fenceSeg([g,.6],[Math.min(N-.6,g+2),.6],false));
  for(let g=.6;g<N-.6;g+=2)add(N-.6+g+.9,fenceSeg([N-.6,g],[N-.6,Math.min(N-.6,g+2)],true));
  for(let g=.6;g<N-.6;g+=2)add(g-.5,fenceSeg([.05,g],[.05,Math.min(N-.6,g+2)],true));
  for(let g=.6;g<N-.6;g+=2)add(N+g+1.2,fenceSeg([g,N-.05],[Math.min(N-.6,g+2),N-.05],false));
  return objs.sort((a,b)=>a.z-b.z).map(o=>o.svg).join('');
}

/* ---------- 相機（拖曳／縮放） ---------- */
const stage=document.getElementById('stage');
stage.innerHTML=`<svg id="svg" xmlns="http://www.w3.org/2000/svg"><g id="world"><g id="ground"></g><g id="objs"></g><g id="dragfoot" style="pointer-events:none"></g></g></svg>`;
const svg=document.getElementById('svg'),world=document.getElementById('world');
const cam={x:0,y:0,s:1};
const MINS=.35,MAXS=2.6;
function applyCam(){
  const vw=stage.clientWidth,vh=stage.clientHeight,minX=-N*TW/2,maxX=N*TW/2,maxY=N*TH;
  cam.x=Math.min(vw-80-minX*cam.s,Math.max(80-maxX*cam.s,cam.x));
  cam.y=Math.min(vh-80+60*cam.s,Math.max(80-maxY*cam.s,cam.y));
  world.setAttribute('transform',`translate(${cam.x.toFixed(1)} ${cam.y.toFixed(1)}) scale(${cam.s.toFixed(3)})`);
  if(typeof placePop==='function')placePop();
}
function zoomAt(sx,sy,ns){ns=Math.max(MINS,Math.min(MAXS,ns));const wx=(sx-cam.x)/cam.s,wy=(sy-cam.y)/cam.s;cam.s=ns;cam.x=sx-wx*ns;cam.y=sy-wy*ns;applyCam()}
function fitFarm(){
  const vw=stage.clientWidth,vh=stage.clientHeight;
  const n=at==='me'?S.plots.length:farmOf(at).plots.length;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(let k=0;k<n;k++){const g=plotGrid(k);x0=Math.min(x0,g.gx);y0=Math.min(y0,g.gy);x1=Math.max(x1,g.gx+1);y1=Math.max(y1,g.gy+1)}
  if(x1-x0<2)x1=x0+2;if(y1-y0<2)y1=y0+2;
  const L=iso(x0,y1),R=iso(x1,y0),T=iso(x0-1.5,y0-1.5),B=iso(x1,y1);
  const w=R.x-L.x,h=B.y-T.y+70;
  cam.s=Math.max(MINS,Math.min(.8,Math.min((vw-90)/w,(vh-300)/h)));
  const cx=(L.x+R.x)/2,cy=(T.y+B.y)/2-30;
  cam.x=vw/2-cx*cam.s;cam.y=vh/2+10-cy*cam.s;applyCam();
}
const ptrs=new Map();let downEl=null,moved=false,drag=null,pin=null,dragObj=null,dragging=false,pinched=false;
svg.addEventListener('pointerdown',e=>{
  svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){downEl=e.target;moved=false;pinched=false;drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};dragObj=editMode&&!placing?dragTarget(e.target):null;dragging=false;if(placing)moveDrag(e.clientX,e.clientY)}
  else if(ptrs.size===2){pinched=true;if(dragging)cancelDrag();dragObj=null;moved=true;const [a,b]=[...ptrs.values()];pin={d:Math.hypot(a.x-b.x,a.y-b.y)||1,s:cam.s,wx:((a.x+b.x)/2-cam.x)/cam.s,wy:((a.y+b.y)/2-cam.y)/cam.s}}
});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)){if(placing&&e.pointerType==='mouse'&&!ptrs.size)moveDrag(e.clientX,e.clientY);return}ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1&&drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>7)moved=true;
    if(placing){moveDrag(e.clientX,e.clientY);return}
    if(moved&&dragObj){if(!dragging)beginDrag();moveDrag(e.clientX,e.clientY);return}
    if(moved){cam.x=drag.cx+dx;cam.y=drag.cy+dy;applyCam()}}
  else if(ptrs.size===2&&pin){const [a,b]=[...ptrs.values()];const ns=Math.max(MINS,Math.min(MAXS,pin.s*Math.hypot(a.x-b.x,a.y-b.y)/pin.d));cam.s=ns;cam.x=(a.x+b.x)/2-pin.wx*ns;cam.y=(a.y+b.y)/2-pin.wy*ns;applyCam()}
});
function endPtr(e){
  if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(ptrs.size===0){if(dragging){finishDrag(e)}else if(placing&&moved&&!pinched&&e.type==='pointerup'){const r=stage.getBoundingClientRect();placeAt(e.clientX-r.left,e.clientY-r.top)}else if(!moved&&downEl&&e.type==='pointerup')onTap(downEl,e);downEl=null;drag=null;pin=null;dragObj=null}
  else if(ptrs.size===1){pin=null;const p=[...ptrs.values()][0];drag={x:p.x,y:p.y,cx:cam.x,cy:cam.y}}
}
svg.addEventListener('pointerup',endPtr);svg.addEventListener('pointercancel',endPtr);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,cam.s*Math.exp(-e.deltaY*.0015))},{passive:false});
document.getElementById('zin').onclick=()=>zoomAt(stage.clientWidth/2,stage.clientHeight/2,cam.s*1.25);
document.getElementById('zout').onclick=()=>zoomAt(stage.clientWidth/2,stage.clientHeight/2,cam.s/1.25);
document.getElementById('zfit').onclick=fitFarm;
window.addEventListener('resize',applyCam);

/* ---- 佈置模式：按住拖曳移動 ---- */
function dragTarget(el){
  if(!el.closest)return null;const f=el.closest('[data-fix]');if(f)return {fixId:f.dataset.fix};
  const d=el.closest('[data-deco]');if(d)return {moveId:d.dataset.deco};
  if(el.closest('[data-pet]'))return {fixId:'pethouse'};
  const p=el.closest('[data-p]');if(p)return {plotK:+p.dataset.p};return null}
function beginDrag(){
  dragging=true;hidePop();const o=dragObj,d=o.moveId?S.decos.find(x=>x.id===o.moveId):null;
  placing={type:d?d.type:null,moveId:o.moveId||null,fixId:o.fixId||null,plotK:o.plotK};draw(true);
  const g=document.createElement('img');g.id='dragghost';g.src=A(placeImg());document.body.appendChild(g);
}
function cellAt(sx,sy){const r=stage.getBoundingClientRect(),wx=(sx-r.left-cam.x)/cam.s,wy=(sy-r.top-cam.y)/cam.s;return {cx:Math.floor((wx/(TW/2)+wy/(TH/2))/2),cy:Math.floor((wy/(TH/2)-wx/(TW/2))/2)}}
function moveDrag(sx,sy){
  let g=document.getElementById('dragghost');if(!g&&placing){g=document.createElement('img');g.id='dragghost';g.src=A(placeImg());document.body.appendChild(g)}if(g){g.style.left=sx+'px';g.style.top=sy+'px'}
  const {cx,cy}=cellAt(sx,sy),sz=placeSize(),gx=cx-(sz.w-1),gy=cy-(sz.h-1),ok=areaFree(gx,gy,sz.w,sz.h,occupied(placeIgnore()));
  const a=iso(gx,gy),b=iso(gx+sz.w,gy),c=iso(gx+sz.w,gy+sz.h),d=iso(gx,gy+sz.h);
  document.getElementById('dragfoot').innerHTML=`<polygon points="${pts([a,b,c,d])}" fill="${ok?'rgba(120,230,90,.55)':'rgba(240,80,60,.5)'}" stroke="${ok?'#2e8b3e':'#b3261e'}" stroke-width="4"/>`;
  if(g)g.classList.toggle('bad',!ok);
}
function cleanDrag(){document.getElementById('dragghost')?.remove();document.getElementById('dragfoot').innerHTML='';dragging=false}
function cancelDrag(){cleanDrag();endPlace()}
function finishDrag(e){const r=stage.getBoundingClientRect();cleanDrag();if(!placeAt(e.clientX-r.left,e.clientY-r.top))endPlace()}

   互動
   ========================================================= */
let at='me', lastSig='';
function onTap(el,e){
  lastTap={x:e.clientX,y:e.clientY};
  if(placing){const r=stage.getBoundingClientRect();return placeAt(e.clientX-r.left,e.clientY-r.top)}
  if(editMode){const fxEl=el.closest&&el.closest('[data-fix]'),dcEl=el.closest&&el.closest('[data-deco]'),pt=el.closest&&el.closest('[data-pet]');
    const pl=el.closest&&el.closest('[data-p]');
    if(fxEl)return fixPop(fxEl.dataset.fix);if(pt)return fixPop('pethouse');if(dcEl)return decoPop(dcEl.dataset.deco);if(pl)return plotEditPop(+pl.dataset.p);hidePop();return}
  if(el.closest&&el.closest('[data-board]')){hidePop();return at==='me'?boardSheet():toast(`${P(at).name}家的佈告欄，訂單要回自己家看`)}
  if(el.closest&&el.closest('[data-mailbox]')){hidePop();return mailSheet()}
  const dc=el.closest&&el.closest('[data-deco]');if(dc)return decoPop(dc.dataset.deco);
  const hs=el.closest&&el.closest('[data-house]');if(hs)return at==='me'?houseSheet():toast(isNpc(at)?'村長的大宅，村子裡最氣派的房子':`${P(at).name}的家`);
  const p=el.closest&&el.closest('[data-p]'),x=el.closest&&el.closest('[data-expand]'),d=el.closest&&el.closest('[data-pet]');
  if(p)return plotPop(+p.dataset.p);
  if(x){hidePop();return expandSheet()}
  if(d)return petPop();
  hidePop();

function plotAct(k,a){
  const mine=at==='me',F=mine?null:farmOf(at),pl=(mine?S.plots:F.plots)[k],x=st(pl),name=mine?'':P(at).name,fam=isFam(at);
  if(a==='speed'){hidePop();return speedSheet(k)}

  if(a==='water'||a==='bug'){
    if(!mine){if((S.help[at]||0)>=HELP_CAP)return toast('今天在這家幫忙的次數用完了');S.help[at]=(S.help[at]||0)+1;stat('helps');const m=fam?2:1;gain(2*m,5*m);if(Math.random()<.35)S.intimacy[at]=(S.intimacy[at]||0)+1;fx(`+${5*m} 金幣`)}

    if(a==='water')pl.df=true;else pl.bf=true;
  }else if(a==='harvest'&&mine&&x.ripe){const n=yieldOf(pl),c=pl.c;const got={'':0,gold:0,glass:0};for(let i=0;i<n;i++)got[rollVariant()]++;
    Object.entries(got).forEach(([v,m])=>{if(!m)return;const key=v?c+'@'+v:c;S.inv[key]=(S.inv[key]||0)+m;discover(key);if(v)stat(v,m)});

    if(got.glass||got.gold){const v=got.glass?'glass':'gold';addLog(`收成到稀有的「${VARS[v].pre}${CROPS[c].n}」！`);setTimeout(()=>{const r=sheet(`<h3>稀有收成！</h3><div class="row" style="justify-content:center">${itemIcon(v?c+'@'+v:c,'big')}</div><p class="hint" style="text-align:center">你收成到 <b>${got.glass?got.glass+' 個炫光琉璃作物.'+CROPS[c].n:''}${got.glass&&got.gold?'、':''}${got.gold?got.gold+' 個金色作物.'+CROPS[c].n:''}</b>！<br>${v==='glass'?'機率只有 0.3%，收購價是一般的 20 倍。':'機率 2%，收購價是一般的 5 倍。'}</p><button class="btn" data-close>太棒了</button>`);r.querySelectorAll('[data-close]')[1]?.remove()},350)}}
  else if(a==='steal'&&!mine&&x.ripe&&!fam){
    if((S.steal[at]||0)>=STEAL_CAP)return toast('今天在這家偷太多次了，明天再來');
    if(yieldOf(pl)<=1)return toast('只剩最後一個，留給主人吧');
    S.steal[at]=(S.steal[at]||0)+1;
    if(F.fed&&Math.random()<guardRate(F.bondLv)){const lose=Math.min(S.coins,15),pn=PETS[F.pet].n;S.coins-=lose;toast(`被${name}家的${pn}發現了！掉了 ${lose} 金幣`);addLog(`偷${name}的菜被${pn}發現，掉了 ${lose} 金幣`)}

  }
  save();draw();hidePop();
}

/* =========================================================
   稀有作物（金色 2%、炫光琉璃 0.3%）
   ========================================================= */
const VARS={'':{pre:'',mul:1},gold:{pre:'金色作物.',mul:5},glass:{pre:'炫光琉璃作物.',mul:20}};
const RARE_GOLD=.02, RARE_GLASS=.003;
const splitKey=k=>{const [c,v]=k.split('@');return [c,v||'']};
const itemName=k=>{const [c,v]=splitKey(k);return VARS[v].pre+CROPS[c].n};
const itemIcon=(k,cls='ic')=>{const [c,v]=splitKey(k),own=v&&SZ[c+'_'+v];return `<span class="vic ${v?(own?'art-':'var-')+v:''} ${cls}"><img src="${A(own?c+'_'+v:c)}" alt=""></span>`};
const invKeys=()=>{const o=[];CK.forEach(c=>['','gold','glass'].forEach(v=>{const k=v?c+'@'+v:c;if(S.inv[k])o.push(k)}));return o};
function rollVariant(){const r=Math.random();return r<RARE_GLASS?'glass':r<RARE_GLASS+RARE_GOLD?'gold':''}
function stat(k,n=1){S.stats[k]=(S.stats[k]||0)+n}

/* =========================================================
   鑽石、信箱
   ========================================================= */
const SPEED_COST=10;    // 1 小時 = 10 鑽石
function addMail(title,body,reward){S.mail.unshift({id:Date.now()+''+Math.random().toString(36).slice(2,6),t:Date.now(),title,body,reward:reward||null,read:false,claimed:false})}
const unreadMail=()=>S.mail.filter(m=>!m.read||(m.reward&&!m.claimed)).length;
function giveReward(r,why){if(!r)return'';const p=[];if(r.c){S.coins+=r.c;p.push(r.c+' 金幣')}if(r.d){S.diamonds+=r.d;p.push(r.d+' 鑽石')}if(r.x){gain(r.x,0)}return p.join('、')}
const rewardTxt=r=>[r.c?`<span class="rw"><img src="${A('coin')}" alt="">${r.c}</span>`:'',r.d?`<span class="rw"><img src="${A('i_diamond')}" alt="">${r.d}</span>`:''].join('');

  const s=sheet(`<h3>信箱<small>${S.mail.length} 封</small></h3>

function openMail(id){

  const s=sheet(`<h3>${esc(m.title)}</h3><div class="letter">${esc(m.body).replace(/\n/g,'<br>')}</div>

function speedSheet(k){

  const s=sheet(`<h3>用鑽石加速<small>擁有 ${S.diamonds} 鑽石</small></h3>

function confirmSpend(k,cost,hrs,all){
  const pl=S.plots[k];
  const s=sheet(`<h3>確定使用鑽石？</h3>
   <div class="confirmbox"><img src="${A('i_diamond')}" alt=""><div><b class="num" style="font-size:22px">${cost}</b> 鑽石<br><small>${all?'讓'+CROPS[pl.c].n+'立即成熟':'讓'+CROPS[pl.c].n+'加速 1 小時'}</small></div></div>
   <p class="hint">目前 ${S.diamonds} 鑽石，使用後剩 <b>${S.diamonds-cost}</b>。鑽石用掉後不會退還。</p>
   <button class="btn red" id="ok">確定使用 ${cost} 鑽石</button>`);
  s.querySelector('[data-close]').textContent='取消';
  s.querySelector('#ok').onclick=()=>{
    if(S.diamonds<cost)return toast('鑽石不夠');
    const p=S.plots[k],x=st(p);if(x.kind!=='crop'||x.ripe){closeSheet();return}
    S.diamonds-=cost;const dt=Math.min(hrs*H/speed(),x.left+1);p.t-=dt;if(p.bug)p.bug-=dt;if(p.dry)p.dry-=dt;stat('speedUps');
    toast(all?`${CROPS[p.c].n}成熟了！`:`${CROPS[p.c].n}加速了 1 小時`);closeSheet();save();draw(true)};
}

const ORDER_N=6, FREE_REFRESH=3, REFRESH_COIN=20, REFRESH_DIA=5, RARE_ORDER_GOLD=.005, RARE_ORDER_GLASS=.005;
// 每週三 22:00 換新
function weekStart(t=Date.now()){const d=new Date(t),w=new Date(d.getFullYear(),d.getMonth(),d.getDate(),22,0,0,0);let back=(d.getDay()-3+7)%7;w.setDate(w.getDate()-back);if(w.getTime()>t)w.setDate(w.getDate()-7);return w.getTime()}
const nextWeek=()=>weekStart()+7*24*H;
function makeOrder(){
  const avail=CK.filter(c=>CROPS[c].lv<=level()),r=Math.random();
  if(r<RARE_ORDER_GLASS+RARE_ORDER_GOLD){const v=r<RARE_ORDER_GLASS?'glass':'gold',c=pick(avail);return {id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),rare:v,items:[{k:c+'@'+v,n:1}],reward:{d:v==='glass'?200:50},done:false}}
  const kinds=Math.min(avail.length,1+(Math.random()<.55?1:0)+(level()>=3&&Math.random()<.45?1:0));
  const pickC=[...avail].sort(()=>Math.random()-.5).slice(0,kinds);
  // 一週的時間比較充裕，數量比每日訂單多
  const items=pickC.map(c=>({k:c,n:Math.max(3,Math.round(rint(6,14)*(CROPS[c].p<40?1.2:CROPS[c].p<100?.8:.5)))}));
  const val=items.reduce((a,i)=>a+i.n*CROPS[i.k].p,0);
  return {id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),items,reward:{c:Math.round(val*1.45/5)*5,x:Math.round(val/10)+5,d:Math.random()<.25?5:0},done:false};
}
const orderReady=o=>o.items.every(i=>(S.inv[i.k]||0)>=i.n);
function ordersTick(){const w=weekStart();if(S.ordWeek!==w){S.ordWeek=w;S.refreshFree=FREE_REFRESH;S.orders=Array.from({length:ORDER_N},makeOrder)}}
function fmtLeft(ms){const d=Math.floor(ms/(24*H)),h=Math.floor(ms%(24*H)/H),m=Math.floor(ms%H/60000);return d?`${d} 天 ${h} 小時`:h?`${h} 小時 ${m} 分`:`${m} 分`}

function refreshOrder(id){
  const o=S.orders.find(x=>x.id===id);if(!o)return;
  const doIt=()=>{const i=S.orders.indexOf(o);S.orders[i]=makeOrder();stat('refreshes');save();draw();boardSheet()};
  const warn=o.rare&&!o.done?`<div class="rumor" style="background:#ffd1c6">這是稀有的${o.rare==='glass'?'炫光琉璃':'金色'}訂單，刷新後很難再遇到。</div>`:'';
  if(S.refreshFree>0){const c=sheet(`<h3>刷新這張訂單？</h3>${warn}<p class="hint">使用 1 次免費刷新（本週剩 ${S.refreshFree} 次）。原本的訂單會消失，換成一張新的。</p><button class="btn" id="y">免費刷新</button>`);c.querySelector('[data-close]').textContent='取消';c.querySelector('#y').onclick=()=>{S.refreshFree--;doIt()};return}
  const c=sheet(`<h3>刷新這張訂單？</h3>${warn}<p class="hint">本週免費刷新已用完，可以用金幣或鑽石刷新。免費次數每週三 22:00 恢復。</p>
    <button class="btn" id="rc" ${S.coins<REFRESH_COIN?'disabled':''}><img class="btnic" src="${A('coin')}" alt="">${REFRESH_COIN} 金幣刷新</button>
    <button class="btn blue" id="rd" ${S.diamonds<REFRESH_DIA?'disabled':''}><img class="btnic" src="${A('i_diamond')}" alt="">${REFRESH_DIA} 鑽石刷新</button>`);
  c.querySelector('[data-close]').textContent='取消';
  c.querySelector('#rc').onclick=()=>{if(S.coins<REFRESH_COIN)return toast('金幣不夠');S.coins-=REFRESH_COIN;doIt()};
  c.querySelector('#rd').onclick=()=>{const c2=sheet(`<h3>確定使用鑽石？</h3><div class="confirmbox"><img src="${A('i_diamond')}" alt=""><div><b class="num" style="font-size:22px">${REFRESH_DIA}</b> 鑽石<br><small>刷新 1 張訂單</small></div></div><p class="hint">目前 ${S.diamonds} 鑽石，使用後剩 <b>${S.diamonds-REFRESH_DIA}</b>。</p><button class="btn red" id="ok">確定使用 ${REFRESH_DIA} 鑽石</button>`);c2.querySelector('[data-close]').textContent='取消';c2.querySelector('#ok').onclick=()=>{if(S.diamonds<REFRESH_DIA)return toast('鑽石不夠');S.diamonds-=REFRESH_DIA;doIt()}};
}

function periodsBack(n){const out=[];const d=new Date();let t=new Date(d.getFullYear(),d.getMonth(),d.getDate(),d.getHours()<12?0:12).getTime();for(let i=0;i<n;i++){out.unshift(t);t-=12*H}return out}
function trendSheet(crop=CK[0],focus='me'){
  const per=periodsBack(14),houses=['me',...S.friends],base=CROPS[crop].p;
  const ser=houses.map(h=>({h,col:h==='me'?'#e2513a':P(h).c,name:h==='me'?'自家':P(h).name,pts:per.map((t,i)=>{const last=i===per.length-1;if(last&&!known(h))return null;return price(h,crop,periodKey(t))})}));
  const all=ser.flatMap(s=>s.pts.filter(Boolean).map(p=>p.p)),max=Math.max(base*1.4,...all),W=320,Ht=170,L=34,R=8,T=10,B=24;
  const X=i=>L+i*(W-L-R)/(per.length-1),Y=v=>T+(1-v/max)*(Ht-T-B);
  const ticks=[0,Math.round(max/2),Math.round(max)];
  const line=s=>{let d='';s.pts.forEach((p,i)=>{if(!p)return;d+=(d&&s.pts[i-1]?'L':'M')+X(i).toFixed(1)+' '+Y(p.p).toFixed(1)});return d};
  const svgc=`<svg viewBox="0 0 ${W} ${Ht}" class="trend" role="img" aria-label="${CROPS[crop].n}收購價走勢">

  </svg>`;
  const f=ser.find(s=>s.h===focus),cur=f.pts[f.pts.length-1];

  s.querySelector('[data-mk]').onclick=marketSheet;
  s.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>trendSheet(b.dataset.c,focus));

/* 擺放 */
let placing=null, editMode=false;
function occupied(ignoreId){
  const o=new Set(),add=(x0,y0,w,h)=>{for(let x=x0;x<x0+w;x++)for(let y=y0;y<y0+h;y++)o.add(x+','+y)};
  S.fixtures.forEach(f=>{if(f.id!==ignoreId){const z=fixSize(f);add(f.gx,f.gy,z.w,z.h)}});
  S.decos.forEach(d=>{if(d.id!==ignoreId)o.add(d.gx+','+d.gy)});
  (S.plotPos||[]).forEach(([x,y],k)=>{if('plot'+k!==ignoreId)o.add(x+','+y)});
  return o;
}
function areaFree(gx,gy,w,h,occ){for(let x=gx;x<gx+w;x++)for(let y=gy;y<gy+h;y++){if(x<0||y<1||x>N-2||y>N-1||occ.has(x+','+y))return false}return true}
const placeSize=()=>placing.fixId?fixSize(fixOf(placing.fixId)):{w:1,h:1};
const placeIgnore=()=>placing.plotK!=null?'plot'+placing.plotK:(placing.fixId||placing.moveId);
const placeName=()=>placing.plotK!=null?'農地':placing.newFix?FIXK[placing.newFix].n:placing.fixId?FIXK[fixOf(placing.fixId).k].n:DECOS[placing.type].n;
const placeImg=()=>placing.plotK!=null?'soil_dry':placing.newFix?placing.newFix:placing.fixId?fixImg(fixOf(placing.fixId)):DECOS[placing.type].img;
function startPlace(type,moveId,fixId,newFix,plotK){closeSheet();hidePop();if(at!=='me'){at='me'}placing={type,moveId,fixId,newFix,plotK};draw(true);
  document.getElementById('placebar').innerHTML=`<div class="panel placebar"><img src="${A(placeImg())}" alt=""><div><b>${moveId||fixId||plotK!=null?'移動':'擺放'}${placeName()}</b><small>按住拖到想放的位置，綠色可以放、紅色不行${placeSize().w>1?`（佔 ${placeSize().w}×${placeSize().h} 格）`:''}</small></div><button class="btn sm alt" id="pcancel">取消</button></div>`;
  document.getElementById('pcancel').onclick=endPlace;zoomAt(stage.clientWidth/2,stage.clientHeight/2,Math.min(cam.s,.7))}
function endPlace(){document.getElementById('dragghost')?.remove();document.getElementById('dragfoot').innerHTML='';placing=null;document.getElementById('placebar').innerHTML='';if(editMode)showEditBar();draw(true)}
function placeAt(sx,sy){
  const wx=(sx-cam.x)/cam.s,wy=(sy-cam.y)/cam.s,cx=Math.floor((wx/(TW/2)+wy/(TH/2))/2),cy=Math.floor((wy/(TH/2)-wx/(TW/2))/2);
  const sz=placeSize(),gx=cx-(sz.w-1),gy=cy-(sz.h-1);   // 點到的格子當作擺設的前角
  if(!areaFree(gx,gy,sz.w,sz.h,occupied(placeIgnore()))){toast('紅色的位置放不下，換個地方');return false}
  if(placing.plotK!=null){S.plotPos[placing.plotK]=[gx,gy];toast('農地移動好了')}
  else if(placing.newFix){const k=placing.newFix;if(!S.fixInv[k])return endPlace();S.fixInv[k]--;S.fixtures.push({id:k+Date.now().toString(36),k,gx,gy});toast(`${FIXK[k].n}擺好了`)}
  else if(placing.fixId){const f=fixOf(placing.fixId);f.gx=gx;f.gy=gy;toast(`${FIXK[f.k].n}移動好了`)}
  else if(placing.moveId){const d=S.decos.find(x=>x.id===placing.moveId);d.gx=gx;d.gy=gy;toast('移動好了')}
  else{if(!S.decoInv[placing.type])return endPlace();S.decoInv[placing.type]--;if(!S.decoInv[placing.type])delete S.decoInv[placing.type];S.decos.push({id:Date.now().toString(36),type:placing.type,gx,gy});toast(`擺好了，魅力 +${DECOS[placing.type].charm}`)}
  save();endPlace();return true;
}
function showEditBar(){document.getElementById('placebar').innerHTML=`<div class="panel placebar edit"><img src="${A('i_deco')}" alt=""><div><b>佈置模式</b><small>按住拖曳移動（農地可一格一格拖）；點一下可以旋轉或收回</small></div><button class="btn sm" id="edone">完成</button></div>`;document.getElementById('edone').onclick=()=>{editMode=false;document.getElementById('placebar').innerHTML='';draw(true)}}
function enterEdit(){if(at!=='me'){at='me';draw(true);fitFarm()}closeSheet();hidePop();editMode=true;showEditBar();draw(true)}
function fixPop(id){
  const f=fixOf(id);if(!f)return;const z=fixSize(f),c=iso(f.gx+z.w/2,f.gy+z.h/2),rm=REMOVABLE.includes(f.k);
  showPop({type:'fix',wx:c.x,wy:c.y-80},`<div class="ph"><img class="ic" src="${A(fixImg(f))}" alt=""><div class="pt"><b>${FIXK[f.k].n}</b><small>佔 ${z.w}×${z.h} 格${f.k==='farm'?'，整片農田一起移動':''}</small></div></div><div class="pa"><button class="btn sm blue" data-a="mv">移動</button><button class="btn sm alt" data-a="fl">旋轉</button>${rm?'<button class="btn sm alt" data-a="rm">收回倉庫</button>':''}</div>`,el=>{
    el.querySelector('[data-a=mv]').onclick=()=>startPlace(null,null,id);
    el.querySelector('[data-a=fl]').onclick=()=>{f.rot=(rotOf(f)+1)%(SZ[fixImg(f)+'_b']?4:2);delete f.flip;save();draw(true);hidePop()};
    el.querySelector('[data-a=rm]')?.addEventListener('click',()=>{S.fixtures=S.fixtures.filter(x=>x.id!==id);S.fixInv[f.k]=(S.fixInv[f.k]||0)+1;hidePop();save();draw(true);toast(`${FIXK[f.k].n}收回倉庫了，空出 1 格`)})});
}
function plotEditPop(k){
  const g=plotGrid(k),c=iso(g.gx+.5,g.gy+.5),pl=S.plots[k];
  showPop({type:'plotedit',wx:c.x,wy:c.y-40},`<div class="ph"><img class="ic" src="${A('soil_dry')}" alt=""><div class="pt"><b>農地</b><small>${pl.c?CROPS[pl.c].n+'會跟著一起移動':'空地'}・可以直接按住拖曳</small></div></div><div class="pa"><button class="btn sm blue" data-a="mv">移動</button></div>`,el=>{el.querySelector('[data-a=mv]').onclick=()=>startPlace(null,null,null,null,k)});
}
function decoPop(id){
  const d=S.decos.find(x=>x.id===id);if(!d)return;const D=DECOS[d.type],c=iso(d.gx+.5,d.gy+.5);
  showPop({type:'deco',wx:c.x,wy:c.y-D.w*.8},`<div class="ph"><img class="ic" src="${A(D.img)}" alt=""><div class="pt"><b>${D.n}</b><small>魅力 +${D.charm}</small></div></div><div class="pa"><button class="btn sm blue" data-a="mv">移動</button><button class="btn sm alt" data-a="fl">旋轉</button><button class="btn sm alt" data-a="back">收回倉庫</button></div>`,el=>{
    el.querySelector('[data-a=mv]').onclick=()=>startPlace(d.type,d.id);
    el.querySelector('[data-a=fl]').onclick=()=>{d.rot=(rotOf(d)+1)%(SZ[DECOS[d.type].img+'_b']?4:2);delete d.flip;save();draw(true);hidePop()};
    el.querySelector('[data-a=back]').onclick=()=>{S.decos=S.decos.filter(x=>x.id!==id);S.decoInv[d.type]=(S.decoInv[d.type]||0)+1;hidePop();save();draw(true);toast('收回倉庫了')}});
}

   <div class="me panel"><button class="avabtn" id="hava" aria-label="更換頭像">${avHtml(S.avatar,42,S.color,'我','ava')}</button><div class="info"><b>${esc(S.name)}</b><div class="stats"><span class="lvl">Lv${l}</span><span class="coin"><img src="${A('coin')}" alt="金幣">${S.coins}</span><span class="coin"><img src="${A('i_diamond')}" alt="鑽石">${S.diamonds}</span></div><div class="xpbar"><i style="width:${Math.round((S.xp-a)/(b-a)*100)}%"></i></div></div></div>
   <div class="rcol"><div class="clock panel">${periodName()}收購價<br><b>${fmtDur(nextRefresh())}</b> 後換盤${speed()>1?`<br><span style="color:var(--sky);font-weight:700">加速 ×${speed()}</span>`:''}</div>
   <div class="hbtns"><button class="hbtn panel" id="hmail" aria-label="信箱"><img src="${A('i_mail')}" alt="">${unreadMail()?`<span class="badge">${unreadMail()}</span>`:''}</button><button class="hbtn panel" id="hedit" aria-label="佈置莊園"><img src="${A('i_deco')}" alt=""></button><button class="hbtn panel" id="hreset" aria-label="重新開始" style="font:700 12px var(--f-body)">重來</button><button class="hbtn panel charmchip" id="hcharm" aria-label="魅力值"><img src="${A('i_charm')}" alt=""><span class="num">${charm().total}</span></button></div></div>`;
  const dock=document.getElementById('dock');
  if(at==='me')dock.innerHTML=`
   <button class="tool" id="t1"><img src="${A('i_order')}" alt="">佈告欄${S.orders.some(o=>!o.done&&orderReady(o))?'<span class="badge">!</span>':''}</button>
   <button class="tool" id="t2">${TOOLICON.market}行情</button>
   <button class="tool" id="t3">${TOOLICON.shop}商店</button>
   <button class="tool" id="t6"><img src="${A('i_codex')}" alt="">收藏${achReady()+codexReady()?`<span class="badge">${achReady()+codexReady()}</span>`:''}</button>
   <button class="tool" id="t4">${TOOLICON.friends}好友</button>
   <button class="tool" id="t5">${TOOLICON.bag}倉庫</button>`;
  else dock.innerHTML=`
   <button class="tool" id="h1">${TOOLICON.home}回家</button>
   <button class="tool" id="h2">${TOOLICON.market}在這裡賣</button>
   <button class="tool" id="h3">${TOOLICON.gift}送禮</button>
   <button class="tool" id="h4">${TOOLICON.friends}好友</button>`;
  const on=(id,f)=>{const el=document.getElementById(id);if(el)el.onclick=f};
  on('t1',boardSheet);on('t2',marketSheet);on('t3',shopSheet);on('t4',friendsSheet);on('t5',bagSheet);on('t6',()=>collectSheet());on('hmail',mailSheet);on('hcharm',charmSheet);on('hedit',enterEdit);on('hreset',resetConfirm);on('hava',avatarSheet);
  document.documentElement.style.setProperty('--hudb',Math.ceil(document.getElementById('hud').getBoundingClientRect().bottom)+'px');
  tutCard();
  on('h1',()=>{at='me';draw(true);fitFarm()});on('h2',()=>sellSheet(at));on('h3',giftSheet);on('h4',friendsSheet);
  const msg=document.getElementById('topmsg');
  if(at!=='me'){const p=P(at);msg.innerHTML=`<div class="visit panel">${p.npc?`村長的莊園・福利：今天還能偷 ${STEAL_CAP-(S.steal[at]||0)} 次`:`正在拜訪 ${esc(p.name)} 的菜園・${isFam(at)?'家人：可幫忙、不能偷':`今天可偷 ${STEAL_CAP-(S.steal[at]||0)} 次`}`}</div>`}
  else if(msg.querySelector('.visit'))msg.innerHTML='';
}
let groundDone=false;
function draw(force){
  if(!groundDone){document.getElementById('ground').innerHTML=groundSvg();groundDone=true}
  const plots=at==='me'?S.plots:farmOf(at).plots,now=Date.now();
  const sig=at+'|'+level()+'|'+(at==='me'?S.pet.id+petAwake()+S.house.style+'|'+S.decos.map(d=>d.type+d.gx+','+d.gy).join(';')+'|'+(placing?placing.type+placing.moveId+placing.fixId:'')+'|'+S.fixtures.map(f=>f.gx+','+f.gy+rotOf(f)).join(';')+S.decos.map(d=>rotOf(d)).join('')+'|'+S.plotPos.join(';')+editMode+'|'+(S.tut.done?'':S.tut.step)+'|'+unreadMail()+'|'+S.orders.map(o=>o.done?1:orderReady(o)?2:0).join(''):'')+'|'+plots.map(p=>{const x=st(p,now);return x.kind==='empty'?'e':p.c+x.stage+(x.dry?'d':'')+(x.bug?'b':'')+yieldOf(p)+Math.floor(x.prog*20)}).join(',');
  if(force||sig!==lastSig){document.getElementById('objs').innerHTML=sceneObjects(at);lastSig=sig}
  drawHud();
}
function tick(){newDay();sim();petDecay();ordersTick();tutTick();achCheck();draw();if(pop&&!document.querySelector('.scrim')){if(pop.type==='plot'&&pop.owner===at)plotPop(pop.k);}}
function start(data){
  S=(data&&data.v===2)?data:(Store.load()||fresh());
  if(!S||S.v!==2)fresh();
  if(!S.house)S.house={style:'farm',owned:['farm']};
  if(!S.pet){const b=(S.dog&&S.dog.breed)||'shiba';S.pet={id:'dog:'+b,owned:((S.dog&&S.dog.owned)||['shiba']).map(x=>'dog:'+x),full:80,happy:70,t:Date.now(),chosen:true};delete S.dog}
  ['dog:shiba','cat:orange'].forEach(id=>{if(!S.pet.owned.includes(id))S.pet.owned.push(id)});if(S.pet.bond==null)S.pet.bond=0;if(S.pet.name==null)S.pet.name='';
  Object.entries(S.farms).forEach(([f,F])=>{if(F.bondLv==null)F.bondLv=Math.floor(hsh(f+'bond')*11)});
  Object.values(S.farms).forEach(F=>{if(!F.pet)F.pet='dog:'+(F.dog||'shiba')});
  if(S.diamonds==null){S.diamonds=100;S.mail=[];welcomeMail(S)}
  ['stats','codex','codexBonus','ach','decoInv'].forEach(k=>{if(!S[k])S[k]={}});['orders','decos','mail'].forEach(k=>{if(!S[k])S[k]=[]});
  if(!S.tut)S.tut={step:0,done:false};
  if(!S.fixtures)S.fixtures=defaultFixtures();
  if(!S.plotPos){const fp=S.fixtures.find(f=>f.k==='farm')||FARM0;S.plotPos=S.plots.map((_,k)=>[fp.gx+RING[k][0],fp.gy+RING[k][1]])}
  S.fixtures=S.fixtures.filter(f=>f.k!=='farm');
  if(!S.fixInv)S.fixInv={};
  // 地圖縮小後，超出範圍的東西收回倉庫（必要設施回到預設位置）
  const inb=(x,y,w=1,h=1)=>x>=0&&y>=0&&x+w<=N&&y+h<=N;const D=defaultFixtures();
  S.fixtures=S.fixtures.filter(f=>{const z=fixSize(f);if(inb(f.gx,f.gy,z.w,z.h))return true;if(REMOVABLE.includes(f.k)){S.fixInv[f.k]=(S.fixInv[f.k]||0)+1;return false}const d=D.find(x=>x.id===f.id);if(d){f.gx=d.gx;f.gy=d.gy}return true});
  S.decos=S.decos.filter(d=>{if(inb(d.gx,d.gy))return true;S.decoInv[d.type]=(S.decoInv[d.type]||0)+1;return false});
  S.friends=S.friends.filter(f=>P(f));if(!S.friends.includes(CHIEF))S.friends.unshift(CHIEF);S.family=S.family.filter(f=>P(f)&&!isNpc(f));
  Object.keys(S.intimacy).forEach(f=>{if(!P(f))delete S.intimacy[f]});Object.keys(S.farms).forEach(f=>{if(!P(f))delete S.farms[f]});if(at!=='me'&&!P(at))at='me';
  if(!S.avatar)S.avatar='av_boy1';
  S.pet.owned.forEach(id=>{if(!S.codex['pet:'+id])S.codex['pet:'+id]=Date.now()});
  if(S.ordWeek==null){S.ordWeek=0;S.refreshFree=FREE_REFRESH}
  ordersTick();lastAchN=achReady();
  newDay();sim();draw(true);fitFarm();setInterval(tick,1000);
  if(HAS_CAT&&!S.pet.chosen)choosePet();
}
window.claude?.hot?.snapshot?.(()=>S);
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
